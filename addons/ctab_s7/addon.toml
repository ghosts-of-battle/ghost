[rapify]
# The cTab device dialogs are laid out with safezone maths (the phone screen
# rectangle inside the 2048px bezel art). The engine evaluates those strings at
# load; HEMTT's rapifier cannot, so this addon ships unrapified - same reason
# as addons/dtvd.
enabled = false

# Note: `hemtt check` reports 7 L-S29 "Undefined Function" warnings for this
# addon. They are false positives - the lint only recognises PREP'd functions,
# and these are declared in CfgFunctions.hpp so they compile before cTab's own
# pass. There is no lint option to silence them per addon.
